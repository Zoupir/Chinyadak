name: Diagnose prepared source

on:
  push:
    branches: [marketplace-rtl-phase1]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --include=dev
      - run: npm run prepare:source
      - name: Dump prepared SSR provider implementation
        run: |
          echo '=== SSR provider lines 45-250 ==='
          nl -ba src/server/ssr-store-context.tsx | sed -n '45,250p'
          echo '=== public build alias ==='
          nl -ba scripts/build-server.mjs | sed -n '1,120p'
          ./node_modules/.bin/tsc --noEmit
