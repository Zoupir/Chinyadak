name: Diagnose prepared source

on:
  push:
    branches: [marketplace-rtl-phase1]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --include=dev
      - run: npm run prepare:source
      - name: Inspect prepared live-section runtime
        run: |
          echo '=== LiveSectionModal save ==='
          grep -n -A100 -B12 "const save = async" src/components/common/LiveSectionModal.tsx || true
          echo '=== Normal StoreContext updateSection ==='
          grep -n -A140 -B12 "const updateSection = async" src/context/StoreContext.tsx || true
          echo '=== SSR StoreContext provider ==='
          grep -n -A220 -B30 "const contextValue" src/server/ssr-store-context.tsx || true
          echo '=== SSR live-editor symbols ==='
          grep -n "updateSection\|previewSection\|updateSettings\|adminAuth\|isLiveEditActive\|setIsLiveEditActive\|pages:" src/server/ssr-store-context.tsx || true
          echo '=== public build alias ==='
          grep -n -A30 -B10 "PUBLIC_HYDRATE_ALIAS_PLUGIN" scripts/build-server.mjs || true
          ./node_modules/.bin/tsc --noEmit
