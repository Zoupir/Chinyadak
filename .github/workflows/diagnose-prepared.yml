name: Diagnose prepared source

on:
  push:
    branches: [marketplace-rtl-phase1]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --include=dev
      - run: npm run prepare:source
      - name: Inspect prepared live-section save contract
        run: |
          echo '=== LiveSectionModal save ==='
          grep -n -A90 -B12 "const save = async" src/components/common/LiveSectionModal.tsx || true
          echo '=== Save button ==='
          grep -n -A12 -B12 "data-live-section-save" src/components/common/LiveSectionModal.tsx || true
          echo '=== StoreContext updateSection ==='
          grep -n -A130 -B12 "const updateSection = async" src/context/StoreContext.tsx || true
          echo '=== Markers ==='
          grep -n "LIVE-SECTION-ATOMIC-SAVE-v301018\|liveSectionSave=1\|data-live-section-save\|onClick={save}\|setIsSaving" src/components/common/LiveSectionModal.tsx src/context/StoreContext.tsx || true
          ./node_modules/.bin/tsc --noEmit
