<html lang="fa" dir="rtl" data-navigation-mode="document">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>یدک استور | فروشگاه تخصصی قطعات خودروهای چینی</title>
    <meta name="description" content="خرید آنلاین قطعات یدکی خودروهای چینی؛ جستجو بر اساس برند، مدل خودرو و شماره فنی." />
    <meta property="og:title" content="فروشگاه قطعات خودرو | بازار تخصصی قطعات یدکی خودروهای چینی" />
    <meta property="og:description" content="قطعات خودروهای چینی را متناسب با برند، مدل خودرو و شماره فنی پیدا کنید." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      (() => {
        const nativePushState = window.history.pushState.bind(window.history);
        window.__YADAK_WEBSITE_MODE__ = true;
        window.history.pushState = function(state, title, url) {
          if (url == null) return nativePushState(state, title, url);
          try {
            const target = new URL(String(url), window.location.href);
            const currentPath = window.location.pathname;
            const currentIsAdmin = currentPath === '/admin' || currentPath.startsWith('/admin/');
            const targetIsAdmin = target.pathname === '/admin' || target.pathname.startsWith('/admin/');
            const sameDocument = target.pathname === window.location.pathname && target.search === window.location.search && target.hash === window.location.hash;
            if (target.origin === window.location.origin && !sameDocument && !(currentIsAdmin && targetIsAdmin)) {
              window.location.assign(target.href);
              return;
            }
          } catch (_) {
            // Fall back to the native History API if the target is not a valid URL.
          }
          return nativePushState(state, title, url);
        };
      })();
    </script>
  </head>
  <body class="bg-neutral-50 text-neutral-900 font-sans antialiased selection:bg-red-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
